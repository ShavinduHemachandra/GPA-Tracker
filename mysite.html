        <div class = "container">

            <h1>GPA TRACKER</h1>

            <input type = "text" id = "name" placeholder = "Enter Your Name"><br>
            <input type = "number" id ="regNumber" placeholder = "Enter Your Registration Number"><br>

            <button id = "maketableBtn"onclick = "maketable()">Create Table</button>

            <table id = "gpaTable">

                    <th>Subject</th>
                    <th>Grade</th>

                </tr>



            </table>

            

        </div>
